version: '3.8'

services:
  proxy:
    build: .
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=ai-security-proxy
      - LLM_PROVIDER=mock
      - MOCK_LLM=true
      - OBSERVABILITY_DB_URL=sqlite:////data/observability.db
    volumes:
      - proxy_data:/data
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  dashboard:
    build: .
    ports:
      - "8501:8501"
    environment:
      - OBSERVABILITY_DB_URL=sqlite:////data/observability.db
      - OBSERVABILITY_API_URL=http://proxy:8000
    volumes:
      - proxy_data:/data
    command: ["streamlit", "run", "dashboard/app.py", "--server.address=0.0.0.0"]
    depends_on:
      - proxy

volumes:
  proxy_data:
